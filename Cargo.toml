[package]
name = "frais"
version = "0.3.0"
edition = "2021"
description = "macOS CLI that scans installed Applications, Homebrew packages, and npm global packages for available updates with LLM-powered version research"
license = "MIT"
repository = "https://github.com/hpy/frais"

[[bin]]
name = "frais"
path = "src/main.rs"

# The library target enables integration tests in tests/
[lib]
name = "frais_lib"
path = "src/lib.rs"

[dependencies]
# --- CLI framework ---
clap = { version = "4", features = ["derive", "env"] }

# --- Async HTTP (blocking mode to match Python's ThreadPoolExecutor + httpx) ---
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "blocking"] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- TOML config ---
toml = "0.8"

# --- Property list (macOS .app bundles) ---
plist = "1"

# --- Version comparison ---
semver = "1"

# --- Logging ---
log = "0.4"
flexi_logger = { version = "0.29", features = ["trc"] }

# --- Terminal UI ---
indicatif = "0.17"
console = "0.15"
syntect = "5"
termimad = "0.31"

# --- Error handling ---
thiserror = "2"
anyhow = "1"

# --- Regex ---
regex = "1"
lazy-regex = "3"

# --- URL handling ---
url = "2"

# --- HTML scraping ---
scraper = "0.22"

# --- Find executables ---
which = "7"

# --- Atomic file writes ---
tempfile = "3"

# --- Time / datetime ---
chrono = "0.4"

# --- Static plugin registration ---
linkme = "0.3"

# --- Lazy static ---
once_cell = "1"

# --- Parallel execution ---
rayon = "1"

# --- Signal handling ---
ctrlc = "3"
libc = "0.2"

# --- Encoding ---
encoding_rs = "0.8"
dialoguer = "0.12.0"
rpassword = "7.5.4"

# --- Path expansion ---
shellexpand = "3"

# --- SHA256 for path_id ---
sha2 = "0.10"

[dev-dependencies]
mockall = "0.13"
assert_cmd = "2"
predicates = "3"
serial_test = "3"
tempfile = "3"
